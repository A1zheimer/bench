[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent-bench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.25.0",
    "openai>=1.30.0",
]
observability = [
    "langfuse>=3.0.0",
]
taskgen = [
    "anthropic>=0.25.0",
    "openai>=1.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_agent_bench*", "data_agent_taskgen*"]
